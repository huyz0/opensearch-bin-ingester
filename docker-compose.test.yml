# SPDX-License-Identifier: Apache-2.0
#
# T3 fixture. RustFS is a TEST FIXTURE, not a supported backend
# (testing.md rule 19a): a local stand-in for S3's wire protocol so tests need
# not hit AWS. Use it for signing, ranges, multipart, list pagination, error
# mapping and conditional-write qualification.
#
# ⚠️ This is a single-node fixture. Do NOT infer distributed RustFS
# conditional-write semantics from it; multi-endpoint atomicity is a separate
# deployment qualification.
#
# Every service declares mem_limit. build.md: WSL2 does not kill the offending
# process, it kills whatever it likes, so a runaway must die as a Docker
# OOM-kill. scripts/check-test-budget.sh asserts these are present and that
# they sum below the ceiling.
services:

  rustfs:
    # ⚠️ PINNED BY DIGEST, not a tag. This repository commits a sha1 for every
    # dependency jar (licenses/*.jar.sha1) and refuses a build whose artefacts
    # drift; a fixture image on `:latest` would be the one supply-chain input
    # nobody pins, and a RustFS release that changes error mapping, signing or
    # conditional-write behaviour would turn a green suite red with no diff to
    # explain it.
    #
    # ⚠️ Digest OBTAINED BY PULLING, not copied from documentation:
    #   docker pull rustfs/rustfs:1.0.0
    #   docker inspect --format='{{index .RepoDigests 0}}' rustfs/rustfs:1.0.0
    # A placeholder was written here first and removed -- a zeros digest would
    # have committed a file that cannot start a container, which is worse than
    # the floating tag it replaced.
    image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_OBS_LOGGER_LEVEL: warn
    ports:
      # testing.md rule 16: no fixed ports. 0 lets the kernel choose and the
      # test reads it back, so two concurrent sessions cannot collide.
      - "0:9000"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s
