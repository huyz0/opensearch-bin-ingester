# ⚠️ Without this the node's own logs never leave the test JVM, and an ingestion
# failure presents only as "0 documents searchable" with no reason anywhere.
status = ERROR
appender.console.type = Console
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%p][%c{1.}] %m%n

rootLogger.level = warn
rootLogger.appenderRef.console.ref = console

logger.pollingingest.name = org.opensearch.indices.pollingingest
logger.pollingingest.level = trace
logger.pollingingest.appenderRef.console.ref = console
logger.pollingingest.additivity = false
