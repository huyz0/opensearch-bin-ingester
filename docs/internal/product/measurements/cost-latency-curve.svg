<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820">
<style>text{font:14px sans-serif;fill:#202124}.title{font-size:18px;font-weight:600}.grid{stroke:#d8dce2;stroke-width:1}.p99{fill:none;stroke:#2563eb;stroke-width:3}.low{fill:none;stroke:#d97706;stroke-width:3}.req{fill:none;stroke:#15803d;stroke-width:3}.cost{fill:none;stroke:#7c3aed;stroke-width:3}</style>
<text x="32" y="30" class="title">M9 cost and latency evidence — measured counts, modelled dollars</text>
<text x="32" y="58" class="title">Visibility p99 vs configured interval ceiling (RustFS measured, ms)</text>
<path class="grid" d="M100 90H820 M100 160H820 M100 230H820"/>
<path class="p99" d="M120,123.65 420,102.31 720,198.3"/>
<circle cx="120" cy="123.65" r="5" fill="#2563eb"/><text x="90" y="113.65">11.395 ms</text>
<circle cx="420" cy="102.31" r="5" fill="#2563eb"/><text x="390" y="92.31">13.681 ms</text>
<circle cx="720" cy="198.3" r="5" fill="#2563eb"/><text x="690" y="188.3">3.396 ms</text>
<text x="120" y="255">250 ms</text>
<text x="420" y="255">1 s</text>
<text x="720" y="255">5 s</text>
<text x="32" y="300" class="title">Low-rate data+commit PUTs per interval vs ceiling (measured)</text>
<path class="grid" d="M100 350H820 M100 397H820 M100 445H820"/>
<path class="low" d="M120,385.83 720,370.25"/>
<circle cx="120" cy="385.83" r="5" fill="#d97706"/><text x="100" y="375.83">1.56</text><text x="95" y="465">250 ms</text>
<circle cx="720" cy="370.25" r="5" fill="#d97706"/><text x="700" y="360.25">1.97</text><text x="695" y="465">5 s</text>
<text x="32" y="515" class="title">Size-triggered write cost at 5 s configured ceiling</text>
<path class="grid" d="M100 560H820 M100 615H820 M100 670H820"/>
<path class="req" d="M120,671.42 420,671.67 720,669.8"/>
<path class="cost" d="M120,667.31 420,667.53 720,665.89"/>
<circle cx="120" cy="671.42" r="5" fill="#15803d"/><circle cx="120" cy="667.31" r="5" fill="#7c3aed"/><text x="128" y="664.42">0.24935513908835705 requests/MiB</text><text x="128" y="682.31">$1.3073/TiB</text><text x="95" y="705">40 MiB/s</text>
<circle cx="420" cy="671.67" r="5" fill="#15803d"/><circle cx="420" cy="667.53" r="5" fill="#7c3aed"/><text x="428" y="664.67">0.24924154530852677 requests/MiB</text><text x="428" y="682.53">$1.3067/TiB</text><text x="395" y="705">80 MiB/s</text>
<circle cx="720" cy="669.8" r="5" fill="#15803d"/><circle cx="720" cy="665.89" r="5" fill="#7c3aed"/><text x="728" y="662.8">0.2500920594047511 requests/MiB</text><text x="728" y="680.89">$1.3112/TiB</text><text x="695" y="705">160 MiB/s</text>
<line x1="120" y1="745" x2="150" y2="745" class="req"/><text x="158" y="750">requests/MiB measured</text><line x1="390" y1="745" x2="420" y2="745" class="cost"/><text x="428" y="750">USD/TiB modelled</text>
<text x="32" y="780">Low-rate requests/MiB: N/A. Billed AWS dollars: NOT-RUN.</text>
