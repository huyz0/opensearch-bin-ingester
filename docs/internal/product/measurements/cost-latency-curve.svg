<circle cx="420" cy="616.32" r="5" fill="#15803d"/><circle cx="420" cy="619.16" r="5" fill="#7c3aed"/><text x="428" y="609.32">0.2744 requests/MiB</text><text x="428" y="634.16">$1.4386/TiB</text><text x="395" y="705">80 MiB/s</text>
