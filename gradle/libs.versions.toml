# Version catalogue. One place a version is written, so an upgrade is one edit
# and a divergence between modules is impossible rather than merely unlikely.
[versions]
# ⚠️ Pinned to the version the research corpus was read from. The pull-based
# ingestion SPI is not stable API; a floating version would silently change the
# interface this plugin implements.
opensearch = "3.8.0"
helidon = "4.3.0"
junit = "5.14.0"
assertj = "3.27.3"
# ⚠️ The AWS SDK v2 SYNCHRONOUS client, which research 40-01 §1 settles: JEP 491
# removed virtual-thread pinning on `synchronized`, so a blocking library IS the
# concurrent API here and no dependency has to be audited for it.
awssdk = "2.55.0"
hdrhistogram = "2.2.2"
jmh = "1.37"
zstd-jni = "1.5.6-1"
lz4-java = "1.8.0"

[libraries]
opensearch = { module = "org.opensearch:opensearch", version.ref = "opensearch" }
opensearch-testframework = { module = "org.opensearch.test:framework", version.ref = "opensearch" }
# OpenSearch 3.x replaced the SecurityManager with a java agent; the test
# framework will not even class-load without its bootstrap on the classpath.
opensearch-agent-bootstrap = { module = "org.opensearch:opensearch-agent-bootstrap", version.ref = "opensearch" }
opensearch-agent = { module = "org.opensearch:opensearch-agent", version.ref = "opensearch" }
helidon-webserver = { module = "io.helidon.webserver:helidon-webserver", version.ref = "helidon" }
helidon-webclient = { module = "io.helidon.webclient:helidon-webclient", version.ref = "helidon" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
awssdk-s3 = { module = "software.amazon.awssdk:s3", version.ref = "awssdk" }
# ⚠️ `url-connection-client`, NOT the default Netty or Apache client: it is the
# JDK's own `HttpURLConnection`, so the SDK arrives with no HTTP stack of its own
# and no reactive runtime. Every call this project makes is blocking on a virtual
# thread, which is what makes the smallest client the right one.
awssdk-url-connection-client = { module = "software.amazon.awssdk:url-connection-client", version.ref = "awssdk" }
hdrhistogram = { module = "org.hdrhistogram:HdrHistogram", version.ref = "hdrhistogram" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
awssdk-http-auth-aws = { module = "software.amazon.awssdk:http-auth-aws", version.ref = "awssdk" }
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstd-jni" }
lz4-java = { module = "org.lz4:lz4-java", version.ref = "lz4-java" }
