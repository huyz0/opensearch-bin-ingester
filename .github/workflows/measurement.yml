# SPDX-License-Identifier: Apache-2.0
name: measurement

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cost:
    name: "L4 — full cost points"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full cost points
        run: >-
          ./gradlew :server:integrationTest
          --tests '*chaos.WriteRequestRateIT'
          --tests '*chaos.LowRateWriteBudgetIT'
          --tests '*chaos.ReadRequestRateIT'
          --tests '*chaos.CrossAzBytesIT'
          --no-daemon
      - name: Refuse skipped full cost tests
        run: python scripts/check-cost-test-results.py --results server/build/test-results/integrationTest --profile full
      - name: Keep measured cost reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cost-points-${{ github.run_id }}
          path: server/build/test-results/integrationTest/TEST-*.xml
          if-no-files-found: warn
          retention-days: 90

  soak:
    name: "L2S — idle-cost soak"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Idle-cost soak test
        run: ./gradlew soakTest --no-daemon

  latency-trends:
    name: "L4 — non-gating latency trends"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Criterion 7 — consumer visibility latency
        continue-on-error: true
        run: ./gradlew :server:integrationTest --tests '*chaos.VisibilityLatencyIT' --no-daemon
      - name: Criterion 9 — durable-intent drain latency
        continue-on-error: true
        run: ./gradlew :server:integrationTest --tests '*chaos.PartitionVisibilityIT' --no-daemon
      - name: Criterion 11 — macro latency
        continue-on-error: true
        run: ./gradlew :server:integrationTest --tests '*chaos.MacroHarnessIT' --no-daemon
      - name: Criterion 11 — compression throughput trend
        continue-on-error: true
        run: ./gradlew :bench:jmh '-PjmhInclude=.*CompressionBenchmark.*' -PjmhForks=1 -PjmhWarmups=1 -PjmhIterations=1 -PjmhMeasurementTime=1s --no-daemon
      - name: Criterion 13 — catch-up visibility latency (when M8.24 lands)
        if: hashFiles('plugin/src/clusterTest/java/**/KillNodeMidBacklogIT.java') != ''
        continue-on-error: true
        run: ./gradlew :plugin:clusterTest --tests '*KillNodeMidBacklogIT' --no-daemon
      - name: Keep latency trend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latency-trends-${{ github.run_id }}
          path: |
            server/build/test-results/integrationTest/TEST-*.xml
            server/build/reports/tests/integrationTest/**
            plugin/build/test-results/clusterTest/TEST-*.xml
            bench/build/jmh.json
          if-no-files-found: warn
          retention-days: 90
