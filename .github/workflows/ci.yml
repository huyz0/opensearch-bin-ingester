# SPDX-License-Identifier: Apache-2.0
#
# L0 of docs/internal/standards/build.md § Execution layers. ⚠️ NOT L1: all eight
# product modules have zero test sources, so a `gradlew test` job recorded a
# green "L1 0s within 300s" having executed nothing. It lands with the first
# product test -- M0.27.
#
# The gates are not reimplemented here: this runs `pre-commit run --all-files`
# against the same .pre-commit-config.yaml the local hook uses, so a check
# written once is enforced in both places.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # ⚠️ The honest reason: the full-tree gates catch what a delta cannot --
    # a rename or deletion elsewhere invalidating something this diff did not
    # touch. It is NOT the L2/L3 safety net build.md describes; there are no
    # L2/L3 jobs here to be safe about.
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # ⚠️ PRs only. Cancelling on main means the superseded commit gets no gate
  # verdict ever, and check-reviewed/check-tdd are local-only, so nothing
  # downstream would notice. One task, one commit means pushes land in bursts.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: "L0 — gates"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # check-tdd, check-test-integrity and check-reviewed compare against a
          # base ref. Without history there is nothing to compare to.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pre-commit
      - name: Dependency licences (authoritative; the shell gate is the fast half)
        run: ./gradlew dependencyLicenses --no-daemon
      # ⚠️ `github.event.before` exists ONLY on `push`. On `schedule` it is
      # undefined; on branch CREATION it is all-zeros; and on a force-push it is
      # a real but orphaned SHA this checkout may not have -- which is why the
      # existence check below is a cat-file rather than a zeros comparison.
      # lib.sh then falls back to `git diff --cached`, which in a fresh checkout
      # is EMPTY -- so check-tdd, check-test-integrity and check-reviewed would
      # examine nothing and print `ok`. The nightly run is the one that exists to
      # catch what the path filter missed, and it is the run where that happens.
      #
      # So: fail when a range cannot be determined, rather than defaulting to a
      # value that silently means "check nothing".
      - name: Resolve the base ref
        id: range
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request) base='${{ github.event.pull_request.base.sha }}' ;;
            push)         base='${{ github.event.before }}' ;;
            *)            base=$(git rev-parse HEAD~1 2>/dev/null || true) ;;
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            # ⚠️ `|| true` so a root commit reaches the message below rather than
            # aborting on git's own "unknown revision" under set -e.
            base=$(git rev-parse HEAD~1 2>/dev/null || true)
          fi
          { [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; } \
            || { echo "::error::cannot resolve a base ref (event=${{ github.event_name }}); range gates would examine nothing, so failing instead"; exit 1; }
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Gates
        env:
          # ⚠️ GATE_SCOPE=full is what makes these gates examine anything: the
          # delta path selects from a staged diff, and a fresh checkout has
          # nothing staged, so every one would print `ok` over an empty set.
          GATE_SCOPE: full
          # ⚠️ CHECK_RANGE is carried but currently drives NOTHING that runs
          # here: under GATE_SCOPE=full the gates resolve through
          # workspace_files, and its only other consumers are check-tdd and
          # check-reviewed, both skipped below, plus check-test-integrity, whose
          # invocation is M0.25. It is set, and fails closed, so it is correct
          # the day M0.25 lands -- not because it guards something today.
          CHECK_RANGE: ${{ steps.range.outputs.base }}
        # ⚠️ Both skips are REQUIRED, and check-reviewed's reason is stronger
        # than "it would pass vacuously". That vacuous branch is taken only when
        # CHECK_RANGE is UNSET; this step exports it, so check-reviewed instead
        # hard-FAILS -- .harness/review/ is gitignored and absent in a fresh
        # checkout, so no verdict can be found for the staged bytes. Removing
        # this skip breaks EVERY run, not just some. Measured, not assumed.
        # check-tdd cannot run at all for the same reason: red records live in
        # gitignored .harness/. AGENTS.md § Gates.
        run: SKIP=check-reviewed,check-tdd pre-commit run --all-files --show-diff-on-failure

  # ⚠️ FILLS L1's DEPENDENCY CACHE OFF L1's CLOCK (M13.59, its review P4): a
  # save tars the whole cache before learning its key exists, so it runs
  # here, beside the gates, and only on a miss -- never inside L1's 5 min.
  gradle-deps:
    name: "Gradle dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # ⚠️ LOOKUP ONLY: this job needs to know the key exists, not its bytes
      # (M13.59 review round 3, P6).
      - name: Restore Gradle dependencies
        id: gradle-deps
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          lookup-only: true
      - name: Resolve what L1 compiles against
        if: steps.gradle-deps.outputs.cache-hit != 'true'
        run: ./gradlew testClasses integrationTestClasses --no-daemon
      # ⚠️ THE KEY THE RESTORE COMPUTED, NOT A FRESH hashFiles (M13.61): after
      # the build, generated `*.gradle.kts` under build/ change the hash, so
      # run 37473607344 saved under a key no restore ever asks for.
      - name: Save Gradle dependencies
        if: steps.gradle-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ steps.gradle-deps.outputs.cache-primary-key }}

  l1:
    name: "L1 — unit tests"
    needs: [gates, gradle-deps]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # ⚠️ RESTORED ONLY: the `gradle-deps` job fills it (M13.59). Uncached, a
      # run spent ~22 s resolving buildSrc's dependencies and ~3.5 s fetching
      # the distribution before compiling anything (run 37464230792). NOT
      # setup-java's `cache: gradle`, which saves only from a job that
      # succeeded and carries the local BUILD cache, from which an unchanged
      # module's tests are served rather than run (its review, P1, P3).
      - name: Restore Gradle dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # ⚠️ FOUR WORKERS HERE, TWO EVERYWHERE ELSE (M13.57): gradle.properties
      # caps workers at two for the WSL2 memory budget (build.md), and this
      # job inherited it -- so the unit step took 170-300 s and, with the cost
      # subset's ~107 s, the job overran its 5 min cap on nearly every push
      # since at least 2026-09-28 (green only at M12.3, M13.21a and M13.26e). The runner has four cores and 16 GiB; four 512 MiB test
      # JVMs fit it. The cap itself is unmoved.
      - name: Product unit tests
        run: ./gradlew test --no-daemon --max-workers=4
      - name: Cost assertions (fast subset)
        env:
          M9_8_RATE: '40'
          M9_8_POINT_DURATION: PT1M
        run: >-
          ./gradlew :server:integrationTest
          --tests '*chaos.WriteRequestRateIT'
          --tests '*chaos.ReadRequestRateIT'
          --tests '*chaos.CrossAzBytesIT'
          --no-daemon
      - name: Refuse skipped fast cost tests
        run: python scripts/check-cost-test-results.py --results server/build/test-results/integrationTest --profile fast
      - name: Refuse an empty L1 test run
        run: python scripts/check-l1-tests.py
