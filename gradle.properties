# Memory caps live here because this is where the runtime enforces them.
# docs/internal/standards/build.md: WSL2 does not kill the offending process,
# it kills whatever it likes -- so a runaway must die as a JVM OutOfMemoryError
# or a Docker OOM-kill, never as a lost session.
#
# Budget (build.md): daemon 1 GiB + compile daemon 512 MiB + test JVM 512 MiB,
# two workers, leaving headroom inside the 8 GiB per-session share of 32 GiB.
# scripts/check-test-budget.sh asserts these are present and sum below the ceiling.
#
# ⚠️ The COMPILE DAEMON's heap is not set here. `org.gradle.java.compile-daemon.jvmargs`
# looks like a Gradle property and is not one -- the string appears nowhere in the
# 9.7.0 distribution. It lives in the conventions plugin as
# `options.forkOptions.memoryMaximumSize`, where the runtime actually reads it.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
