# SPDX-License-Identifier: Apache-2.0
# All repository gates run in the Gradle/JDK task graph. No Python, Bash, or
# platform-specific shell is part of enforcement.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: gradle-gates
        name: repository gates (Gradle/JDK)
        entry: ./gradlew.bat gates
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: gradle-review-evidence
        name: staged review evidence (Gradle/JDK)
        entry: ./gradlew.bat checkReviewed
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: gradle-tdd-evidence
        name: TDD red evidence (Gradle/JDK)
        entry: ./gradlew.bat checkTdd
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: gradle-test-integrity
        name: test integrity (Gradle/JDK)
        entry: ./gradlew.bat checkTestIntegrity
        language: system
        stages: [commit-msg]
        pass_filenames: false
        always_run: true
      - id: gradle-mutants
        name: mutation gate (Gradle/JDK)
        entry: ./gradlew.bat checkMutants
        language: system
        stages: [manual]
        pass_filenames: false
        always_run: true
      - id: gradle-commit-message
        name: commit message gate (Gradle/JDK)
        entry: ./gradlew.bat checkCommitMessage
        language: system
        stages: [commit-msg]
        pass_filenames: false
